<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ball, Base, Backup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Graduate&family=Barlow+Semi+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: a full-bleed WebGL ballfield seen from the press box; scoreboard plates sit on the edges; every explanation is chalked onto the field itself. */
:root{
  --board:#11201a; --board-2:#192c23; --board-3:#22392d; --rule:rgba(233,239,228,.16);
  --chalk:#eef2e8; --dim:#a6b6a9; --gold:#ffd23f; --aqua:#4be3ff; --good:#5fe08c; --bad:#ff6b57; --clay:#c97b4b;
  --f-disp:"Graduate","Rockwell","Arial Black",serif;
  --f-ui:"Barlow Semi Condensed","Arial Narrow","Segoe UI",system-ui,sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--board);color:var(--chalk);overflow:hidden}
body{font:500 15px/1.4 var(--f-body)}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
#app{position:fixed;inset:0}
#gl{display:block;width:100%;height:100%;outline:none;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.tag{position:absolute;transform:translate(-50%,0);font:700 11px/1 var(--f-ui);letter-spacing:.06em;color:var(--chalk);background:rgba(8,18,12,.62);padding:2px 5px;border-radius:3px;white-space:nowrap}
.tag.me{background:var(--gold);color:#14200f}
.tag.ghost{background:transparent;color:var(--aqua)}
.tag.cue{font-size:12px;padding:3px 7px;text-transform:uppercase;letter-spacing:.08em;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.tag.cue.bunt{background:#4be3ff;color:#0d1a14}.tag.cue.steal{background:#ff6b57;color:#fff}.tag.cue.take{background:rgba(8,18,12,.8);color:var(--chalk)}
.pid{font:700 11px/1.3 ui-monospace,Menlo,Consolas,monospace;color:var(--dim);letter-spacing:.02em;background:none;border:0;padding:0;margin:2px 0 6px;text-align:left;cursor:default;word-break:break-all}
button.pid{cursor:pointer}button.pid:hover,button.pid:focus-visible{color:var(--gold);outline:none}
.bubble{position:absolute;transform:translate(-50%,-100%);font:800 14px/1 var(--f-ui);letter-spacing:.04em;text-transform:uppercase;color:#13201a;background:#fff;padding:5px 8px;border-radius:8px;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fff}
.bubble.me{background:var(--gold)}.bubble.me::after{border-top-color:var(--gold)}
.glabel{position:absolute;transform:translate(-50%,-50%);font:700 12px/1.2 var(--f-ui);letter-spacing:.03em;padding:3px 7px;border-radius:4px;background:rgba(6,14,10,.78);color:var(--chalk);white-space:nowrap;opacity:0;transition:opacity .35s}
.glabel.show{opacity:1}.glabel.aqua{color:var(--aqua)}.glabel.gold{color:var(--gold)}.glabel.bad{color:var(--bad)}.glabel.dim{color:#cfd9cf;font-size:11px;background:rgba(6,14,10,.55)}
.glabel.big{font-size:14px;padding:4px 9px}
.glabel.pin{color:#ff8fe2}
.tbtn.recb{font-variant-numeric:tabular-nums}.tbtn .dot.rec{background:#ff4d4d;box-shadow:0 0 0 3px rgba(255,77,77,.3);animation:recp 1.2s ease-in-out infinite}@keyframes recp{50%{opacity:.35}}
.tbtn .lvl{display:inline-block;width:34px;height:5px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}.tbtn .lvl i{display:block;height:100%;width:0;background:var(--good)}
.coachbox{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--rule);padding-top:10px}
.cprompt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;width:min(420px,calc(100% - 32px));box-sizing:border-box;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.cprompt h3{margin:0;font:400 22px var(--f-disp)}.cprompt p{margin:0;color:#d9e2d6}.cprompt .crow{display:flex;gap:8px;flex-wrap:wrap}
.coachbox textarea{width:100%;box-sizing:border-box;background:var(--board-3);color:var(--chalk);border:1px solid var(--rule);border-radius:6px;padding:7px 8px;font:500 13px/1.4 var(--f-body);resize:vertical}
.coachbox textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.coachbox .crow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.coachbox .btn{padding:6px 10px;font-size:12px}
#hud{position:absolute;inset:0;pointer-events:none;z-index:3}
.plate{background:var(--board-2);border:1px solid var(--rule);border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
#sb{position:absolute;left:12px;top:12px;display:flex;gap:0;align-items:stretch;pointer-events:none;max-width:calc(100% - 300px);overflow:hidden}
@media (max-width:700px){#sb{left:8px;max-width:calc(100% - 170px)}#tools{right:8px}}
#sb .cell{display:flex;flex-direction:column;justify-content:center;padding:6px 12px;border-right:1px solid var(--rule);min-width:0}
#sb .cell:last-child{border-right:0}
.k{font:700 10px/1 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.v{font:400 21px/1.1 var(--f-disp);color:var(--chalk);font-variant-numeric:tabular-nums;white-space:nowrap}
.v small{font:700 13px var(--f-ui);letter-spacing:.06em;color:var(--dim);margin-left:4px}
.outs{display:flex;gap:5px;margin-top:5px}.outs i{width:11px;height:11px;border-radius:50%;border:2px solid var(--dim);box-sizing:border-box}.outs i.on{background:var(--bad);border-color:var(--bad)}
.sitnote{font:800 13px/1.15 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--gold);max-width:200px}
#tools{position:absolute;right:12px;top:12px;display:flex;gap:6px;pointer-events:auto}
.tbtn{display:inline-flex;align-items:center;gap:6px;background:var(--board-2);border:1px solid var(--rule);border-radius:6px;padding:7px 10px;font:700 13px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;color:var(--chalk)}
.tbtn:hover,.tbtn:focus-visible{border-color:var(--gold);outline:none}
.tbtn .dot{width:9px;height:9px;border-radius:50%;background:#5a6a5e}
.tbtn .dot.on{background:var(--good);box-shadow:0 0 0 3px rgba(95,224,140,.25)}
.tbtn .dot.warn{background:var(--bad)}
#flash{position:absolute;left:50%;top:76px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
.fl{font:400 26px/1 var(--f-disp);letter-spacing:.02em;color:var(--chalk);text-shadow:0 3px 0 rgba(0,0,0,.55),0 0 18px rgba(0,0,0,.4);animation:flin .25s ease-out}
.fl.good{color:var(--good)}.fl.bad{color:var(--bad)}.fl.gold{color:var(--gold)}
@keyframes flin{from{transform:scale(1.25);opacity:0}to{transform:none;opacity:1}}
#calls{position:absolute;left:12px;bottom:12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;max-width:min(600px,calc(100% - 24px));pointer-events:auto}
#calls .cb{display:inline-flex;align-items:center;background:none;border:1px solid transparent;border-radius:5px;padding:2px 4px;cursor:pointer;font:600 13px var(--f-ui);color:var(--chalk)}
#calls .cb:hover,#calls .cb:focus-visible{border-color:var(--gold);outline:none}
#calls .row{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font:600 13px var(--f-ui)}
#calls .ttl{font:800 10px var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
#calls .heard{font:600 12px var(--f-ui);color:var(--dim)}
.kc{display:inline-grid;place-items:center;min-width:18px;height:19px;padding:0 5px;border-radius:4px;background:#e7e6dd;color:#16211a;font:800 11px var(--f-ui);box-sizing:border-box;margin-right:3px}
.pg{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 4px;border-radius:50%;font:800 11px var(--f-ui);color:#10140f;box-sizing:border-box;margin-right:3px}
.pg.a{background:#5bd18a}.pg.b{background:#ff6b5c}.pg.x{background:#4aa3ff}.pg.y{background:#f6c431}.pg.s{border-radius:5px;background:#c9ced2}
#prompt{position:absolute;left:12px;top:70px;width:330px;padding:18px 20px;box-sizing:border-box;pointer-events:auto}
@media (max-width:760px){#prompt{left:8px;right:8px;top:auto;bottom:8px;width:auto}}
#prompt h2{margin:0 0 6px;font:400 24px/1.15 var(--f-disp);text-wrap:balance}
#prompt p{margin:0 0 14px;max-width:44ch;color:var(--dim)}
#prompt .gline{font:800 13px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:-2px 0 8px}
#prompt .chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:0 0 10px}#prompt .chips span:not(.k){background:var(--board-3);border-radius:999px;padding:3px 9px;font:700 13px var(--f-ui)}#prompt .chips .k{margin-right:2px}
#prompt p.steps{font:600 13px var(--f-ui);color:var(--chalk);margin:-6px 0 12px}
#prompt .you{display:inline-flex;align-items:center;gap:8px;font:800 14px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.jersey{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--chalk);color:#1f2f5a;font:400 15px var(--f-disp)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--gold);color:#18200f;border:0;border-radius:6px;padding:10px 18px;font:800 15px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.btn:hover,.btn:focus-visible{outline:3px solid #fff3;outline-offset:2px}
.btn.ghost{background:transparent;color:var(--chalk);border:1px solid var(--rule)}
.btn.ghost:hover,.btn.ghost:focus-visible{border-color:var(--gold)}
#decide{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(600px,calc(100% - 24px));padding:12px 14px 14px;box-sizing:border-box;pointer-events:auto;z-index:6}
#decide h3{margin:0 0 2px;font:400 20px/1.15 var(--f-disp)}
#decide .sub{margin:0 0 10px;color:var(--dim);font:600 13px var(--f-ui)}
#decide .clock{height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden;margin:-4px 0 10px}#decide .clock i{display:block;height:100%;background:var(--gold)}
.dgrid{display:grid;grid-template-columns:200px 1fr;gap:12px;align-items:center}
@media (max-width:560px){.dgrid{grid-template-columns:1fr}}
.diam{position:relative;width:200px;height:170px;margin:0 auto}
.diam svg{position:absolute;inset:0}
.ob{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--board-3);border:2px solid transparent;border-radius:7px;padding:8px 10px;font:700 15px/1.15 var(--f-ui);cursor:pointer;color:var(--chalk)}
.ob small{display:block;font:500 12px var(--f-ui);color:var(--dim)}
.ob:hover,.ob:focus-visible,.ob.on{border-color:var(--gold);outline:none}
.diam .ob{position:absolute;width:auto;padding:5px 8px;transform:translate(-50%,-50%);flex-direction:column;gap:2px;text-align:center;font-size:13px}
.olist{display:flex;flex-direction:column;gap:6px}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tgrid .ob{flex-direction:row}
.tic{flex:none;width:40px;height:40px}
#review{position:absolute;left:12px;top:70px;bottom:12px;width:330px;overflow:auto;padding:14px 16px 16px;box-sizing:border-box;pointer-events:auto;z-index:6;display:flex;flex-direction:column;gap:10px}
#review.min{bottom:auto}
#review .rh{display:flex;gap:12px;align-items:center}
#review .score{font:400 40px/1 var(--f-disp);font-variant-numeric:tabular-nums}
#review .grade{font:800 14px var(--f-ui);letter-spacing:.12em;text-transform:uppercase}
#review .pn{font:600 13px var(--f-ui);color:var(--dim)}
#review .job{font:800 15px/1.25 var(--f-ui);letter-spacing:.02em}
#review .job b{color:var(--aqua)}
.parts{display:flex;flex-direction:column;gap:5px}
.part{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:start;font:600 14px/1.3 var(--f-ui)}
.part .ic{width:16px;height:16px;border-radius:50%;margin-top:1px;display:grid;place-items:center;font:900 11px var(--f-ui);color:#10140f}
.part .ic.ok{background:var(--good)}.part .ic.no{background:var(--bad)}.part .ic.mid{background:var(--gold)}
.part .pts{font:700 12px var(--f-ui);color:var(--dim);font-variant-numeric:tabular-nums}
.note{font:500 14px/1.45 var(--f-body);color:#d9e2d6;margin:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font:600 12px var(--f-ui);color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{display:inline-block;width:18px;height:4px;border-radius:2px}
.rbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.rbtns .btn{padding:8px 12px;font-size:13px}
#review .tog{display:flex;align-items:center;gap:8px;font:600 13px var(--f-ui);color:var(--dim);cursor:pointer}
.overlay{position:absolute;inset:0;z-index:10;overflow:auto;background:linear-gradient(180deg,rgba(9,17,13,.86),rgba(9,17,13,.94))}
.menu{max-width:1060px;margin:0 auto;padding-block:28px 32px;padding-inline:16px;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px}
@media (max-width:880px){.menu{grid-template-columns:1fr}}
.logo{font:400 clamp(34px,5.6vw,60px)/.95 var(--f-disp);letter-spacing:.01em;text-wrap:balance;margin:0}
.logo span{color:var(--gold)}
.ver{display:inline-block;margin-top:6px;font:800 11px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);border:1px solid var(--rule);border-radius:4px;padding:2px 6px}
.tagline{margin:8px 0 12px;color:var(--dim);font:600 17px/1.35 var(--f-ui);max-width:46ch}
.pick{position:relative;width:min(100%,460px,calc((100vh - 330px) * 1.21));min-width:min(100%,260px);aspect-ratio:460/380;margin:0}
.pick svg{position:absolute;inset:0;width:100%;height:100%}
.pb{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;cursor:pointer;padding:2px;color:var(--chalk)}
.pb .jersey{width:38px;height:38px;font-size:17px;box-shadow:0 0 0 2px rgba(0,0,0,.25);transition:transform .12s}
.pb .pl{font:800 11px var(--f-ui);letter-spacing:.1em;background:rgba(8,18,12,.7);padding:1px 5px;border-radius:3px}
.pb:hover .jersey,.pb:focus-visible .jersey{transform:scale(1.1)}
.pb:focus-visible{outline:none}
.pb.on .jersey{background:var(--gold);color:#18200f;box-shadow:0 0 0 3px #fff8}
.mixed{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.drills{margin-top:16px}.drills .seg button{flex:1 1 150px}
.menu>div:first-child .startrow{margin-top:12px}.drills .seg button{padding:6px 10px}
.chipbtn{background:var(--board-3);border:2px solid transparent;border-radius:999px;padding:7px 14px;font:800 13px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;color:var(--chalk)}
.chipbtn.on{border-color:var(--gold);color:var(--gold)}
.chipbtn:hover,.chipbtn:focus-visible{border-color:var(--gold);outline:none}
.set{display:flex;flex-direction:column;gap:14px}
.menu.solo,.menu.setmenu{grid-template-columns:minmax(0,1fr);max-width:620px;gap:0}
.menu.setmenu{max-width:760px}.setmenu .set{margin-top:14px}
.solo .logo{font-size:clamp(28px,6vw,46px);white-space:nowrap}
@media (max-width:480px){.gear span{display:none}.gear{padding:8px}.solo .logo{font-size:clamp(22px,7.2vw,46px)}}
.tophead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.gear{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--board-3);border:2px solid transparent;border-radius:999px;padding:7px 14px 7px 10px;font:800 13px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--chalk);cursor:pointer;margin-top:4px}
.gear:hover,.gear:focus-visible{border-color:var(--gold);outline:none}
.sethead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.sethead .logo{font-size:clamp(30px,4.6vw,46px)}
.sumline{margin-top:16px}.linkbtn{background:none;border:0;border-bottom:1px solid currentColor;padding:0;color:var(--gold);font:inherit;cursor:pointer}
.linkbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.srow{display:flex;flex-direction:column;gap:6px}
.srow .lab{font:800 11px var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:var(--board-3);border:2px solid transparent;border-radius:6px;padding:7px 11px;font:700 14px/1.15 var(--f-ui);cursor:pointer;color:var(--chalk);text-align:left}
.seg button small{display:block;font:500 11px var(--f-ui);color:var(--dim)}
.seg button.on{border-color:var(--gold)}
.sel{background:var(--board-3);color:var(--chalk);border:2px solid transparent;border-radius:6px;padding:7px 10px;font:700 14px var(--f-ui);cursor:pointer}
.sel:focus-visible,.sel:hover{border-color:#ffd23f99;outline:none}
.swatch{display:inline-block;width:26px;height:26px;border-radius:50%;border:2px solid var(--rule);align-self:center}
.vsn{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.vsn input{background:var(--board-3);color:var(--chalk);border:2px solid transparent;border-radius:6px;padding:6px 9px;font:700 14px var(--f-ui);width:130px}.vsn input:focus{border-color:var(--gold);outline:none}
.vsbar{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}.vsbar .pl{flex:1;min-width:140px;background:var(--board-2);border:2px solid var(--rule);border-radius:6px;padding:8px 12px}.vsbar .pl.win{border-color:var(--gold)}.vsbar .pl b{display:block;font:400 30px var(--f-disp)}.vsbar .pl span{font:700 12px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.handoff{position:absolute;inset:0;z-index:12;display:grid;place-items:center;background:rgba(9,17,13,.82);padding:16px}.handoff .plate{padding:22px 26px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;width:min(420px,100%);box-sizing:border-box}.handoff h2{margin:0;font:400 28px var(--f-disp)}.handoff .big{font:400 54px/1 var(--f-disp);color:var(--gold)}.handoff p{margin:0;color:var(--dim)}
.camp{max-width:760px;margin:0 auto;padding:28px 16px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px}.camp h1{margin:0;font:400 clamp(30px,5vw,48px)/1 var(--f-disp)}.camp h1 span{color:var(--gold)}
.camp .who{display:flex;gap:14px;align-items:center}.camp .face{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:400 24px var(--f-disp);color:#fff;overflow:hidden;flex:none;border:3px solid #fff3}.camp .face img{width:100%;height:100%;object-fit:cover}
.tiers{display:flex;gap:8px;flex-wrap:wrap}.tiers .t{flex:1;min-width:120px;display:flex;gap:8px;align-items:center;background:var(--board-2);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;font:700 13px var(--f-ui)}.tiers .t.on{border-color:var(--gold);box-shadow:0 0 0 2px #ffd23f55}.tiers .t .medal{width:30px;height:30px}.tiers .t small{display:block;color:var(--dim);font-weight:600}
.seg button:hover,.seg button:focus-visible{border-color:#ffd23f99;outline:none}
.hint{font:500 13px/1.45 var(--f-body);color:var(--dim);margin:0;max-width:62ch}
.status{display:flex;gap:8px;align-items:flex-start;font:600 13px/1.4 var(--f-ui);color:var(--chalk);background:var(--board-3);border-radius:6px;padding:8px 10px}
.status .dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:4px;background:var(--gold)}
.status .dot.ok{background:var(--good)}.status .dot.no{background:var(--bad)}
.startrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:4px}
table.ctl{width:100%;border-collapse:collapse;font:600 13px var(--f-ui)}
table.ctl td{border-top:1px solid var(--rule);padding:6px 6px;vertical-align:top}
table.ctl td:first-child{color:var(--dim);white-space:nowrap}
details summary{cursor:pointer;font:800 12px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.book{max-width:980px;margin:0 auto;padding-block:28px;padding-inline:16px;box-sizing:border-box}
.book h2{font:400 34px/1 var(--f-disp);margin:0 0 6px}
.book .sum{color:var(--dim);font:600 16px var(--f-ui);margin:0 0 18px}
.boxes{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:0;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
